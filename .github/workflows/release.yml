name: Release on Tag

on:
  push:
    tags:
      - "proton_*"
      - "[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (include submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create release archives including submodules
        run: |
          mkdir release-src

          # Copy main repo + submodules
          git ls-files --recurse-submodules -z | xargs -0 tar -czf source-${{ github.ref_name }}.tar.gz
          git ls-files --recurse-submodules -z | xargs -0 zip source-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Auto-generated release for `${{ github.ref_name }}` including submodules.
          files: |
            source-${{ github.ref_name }}.tar.gz
            source-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
