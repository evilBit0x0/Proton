name: Release on Tag

on:
  workflow_dispatch:
  push:
    tags:
      - "proton_*"
      - "[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create source directory including submodules
        run: |
          mkdir source
          tar -cf - --exclude='.git' . | tar -xf - -C source

      - name: Create max-compression archives
        run: |
          # TAR.GZ (max compression)
          tar -czvf source-${{ github.ref_name }}.tar.gz -C source . --options gzip:9

          # ZIP (max compression)
          cd source
          zip -9 -r ../source-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Auto-generated release with full submodule contents and max-level compression.
          files: |
            source-${{ github.ref_name }}.tar.gz
            source-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
